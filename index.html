<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173A2D" />
    <meta name="description" content="Nomly: say what you ate, get it logged. On-device AI when your device can, cloud when it can't." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <title>Nomly</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-word">Nomly</div>
      <div class="splash-tag">Say it. Log it. Love it.</div>
    </div>

    <div id="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1>Nomly</h1>
        </div>
        <button class="mode-chip" id="modeChip" type="button" aria-live="polite">
          <span class="dot"></span><span id="modeText">Checking AI...</span>
        </button>
      </header>

      <section class="scene" aria-label="Nomi, your food buddy">
        <div class="hills back"></div>
        <div class="hills front"></div>
        <p class="bubble" id="bubble" aria-live="polite">What did you eat today?</p>
        <div class="mascot-wrap">
          <svg id="mascot" class="mascot" data-mood="idle" viewBox="0 0 200 220" role="img" aria-label="Nomi, a friendly guava mascot">
            <defs>
              <radialGradient id="bodyGrad" cx="38%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#FFA8BD" />
                <stop offset="55%" stop-color="#FF6F91" />
                <stop offset="100%" stop-color="#E5456E" />
              </radialGradient>
            </defs>
            <ellipse class="shadow" cx="100" cy="206" rx="50" ry="8" fill="#000" opacity="0.22" />
            <g class="bob">
              <g class="feet" fill="#E5456E">
                <ellipse cx="78" cy="198" rx="15" ry="9" />
                <ellipse cx="122" cy="198" rx="15" ry="9" />
              </g>
              <g class="arm arm-l"><ellipse cx="44" cy="136" rx="11" ry="23" transform="rotate(20 44 136)" fill="#FF6F91" /></g>
              <g class="arm arm-r"><ellipse cx="156" cy="136" rx="11" ry="23" transform="rotate(-20 156 136)" fill="#FF6F91" /></g>
              <circle cx="100" cy="124" r="62" fill="url(#bodyGrad)" />
              <ellipse cx="138" cy="84" rx="15" ry="10" fill="#E5456E" opacity="0.55" transform="rotate(30 138 84)" />
              <ellipse cx="76" cy="86" rx="17" ry="9" fill="#fff" opacity="0.38" transform="rotate(-30 76 86)" />
              <ellipse cx="66" cy="142" rx="10" ry="6" fill="#FF4F7A" opacity="0.5" />
              <ellipse cx="134" cy="142" rx="10" ry="6" fill="#FF4F7A" opacity="0.5" />
              <g class="eyes">
                <g class="eye"><circle cx="82" cy="122" r="11" fill="#3B1E1A" /><circle cx="78.5" cy="118" r="4" fill="#fff" /><circle cx="85" cy="127" r="2" fill="#fff" /><ellipse class="lid" cx="82" cy="122" rx="12.5" ry="12.5" fill="#FF7C9B" /></g>
                <g class="eye"><circle cx="118" cy="122" r="11" fill="#3B1E1A" /><circle cx="114.5" cy="118" r="4" fill="#fff" /><circle cx="121" cy="127" r="2" fill="#fff" /><ellipse class="lid" cx="118" cy="122" rx="12.5" ry="12.5" fill="#FF7C9B" /></g>
              </g>
              <path class="mouth m-smile" d="M89,151 Q100,162 111,151" fill="none" stroke="#3B1E1A" stroke-width="3.5" stroke-linecap="round" />
              <g class="mouth m-big"><path d="M86,148 Q100,176 114,148 Z" fill="#3B1E1A" /><ellipse cx="100" cy="162" rx="7" ry="4" fill="#FF6F91" /></g>
              <ellipse class="mouth m-o" cx="100" cy="154" rx="5" ry="6.5" fill="#3B1E1A" />
              <path class="mouth m-flat" d="M92,155 L108,155" fill="none" stroke="#3B1E1A" stroke-width="3.5" stroke-linecap="round" />
              <g class="sparkles" fill="#FFD84D">
                <path class="sp s1" d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4Z" transform="translate(30 52)" />
                <path class="sp s2" d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4Z" transform="translate(172 60)" />
                <path class="sp s3" d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4Z" transform="translate(148 14)" />
              </g>
              <text class="zzz" x="146" y="64" fill="#FFF4E0" font-size="22" font-weight="700" font-family="DM Sans, sans-serif">z</text>
            </g>
          </svg>
        </div>
      </section>

      <section class="card ring-card" aria-label="Today's calories">
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" />
          </svg>
          <div class="ring-center">
            <span class="ring-num" id="kcal">0</span>
            <span class="ring-label">of <button id="goalBtn" class="goal-btn" type="button">2000</button> kcal</span>
          </div>
        </div>
        <div class="macros">
          <div class="macro"><span>Protein</span><div class="bar" id="barP"></div><b id="valP">0 g</b></div>
          <div class="macro"><span>Carbs</span><div class="bar" id="barC"></div><b id="valC">0 g</b></div>
          <div class="macro"><span>Fat</span><div class="bar" id="barF"></div><b id="valF">0 g</b></div>
        </div>
      </section>

      <section class="card log-card">
        <label for="mealInput" class="sr-only">Describe what you ate</label>
        <textarea id="mealInput" rows="2" placeholder="2 idli with sambar and a filter coffee"></textarea>
        <div class="row">
          <select id="langSel" aria-label="Speech language">
            <option value="en-IN">English</option>
            <option value="ta-IN">தமிழ்</option>
          </select>
          <button id="micBtn" class="mic" type="button" aria-label="Speak your meal">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" />
            </svg>
          </button>
          <button id="camBtn" class="mic cam" type="button" aria-label="Scan a photo of your meal">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M9 4 7.2 6H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" />
            </svg>
          </button>
          <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
          <button id="logBtn" class="primary" type="button">Log meal</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card week-card" aria-label="This week">
        <div class="week-head">
          <h2>This week</h2>
          <span class="streak" id="streak"></span>
        </div>
        <div class="week" id="week"></div>
      </section>

      <section aria-label="Today's meals">
        <h2>Today</h2>
        <ul id="list" class="list"></ul>
        <p class="empty" id="empty">Nothing logged yet. Tap the mic and say what you ate.</p>
      </section>

      <footer class="foot">Estimates only, not medical advice. Meals are stored on this device.</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
